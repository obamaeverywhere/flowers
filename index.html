<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Garden Made of Light</title>
<style>
  :root {
    color-scheme: dark;
    --rose: #f39ab2;
    --soft-rose: #f9c3d2;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  .dedication {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(48px, 10vh, 110px) 20px clamp(18px, 4vh, 40px);
    box-sizing: border-box;
    pointer-events: none;
    text-align: center;
    text-shadow: 0 2px 14px #000, 0 0 4px #000;
  }
  .dedication h1 {
    margin: 0;
    color: var(--soft-rose);
    font-size: clamp(1.45rem, 4vw, 3.2rem);
    font-weight: normal;
    letter-spacing: 0.06em;
  }
  .dedication p {
    margin: 0.45rem 0 0;
    color: #f6e8ed;
    font-size: clamp(0.9rem, 1.8vw, 1.2rem);
    letter-spacing: 0.04em;
  }
  .dedication .hint {
    color: #d7bec7;
    font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: clamp(0.62rem, 1.2vw, 0.8rem);
    letter-spacing: 0.03em;
  }
  .proposal-card {
    position: fixed;
    left: 50%;
    bottom: clamp(108px, 17vh, 165px);
    width: min(90vw, 430px);
    padding: 1rem 1rem 0.85rem;
    box-sizing: border-box;
    transform: translate(-50%, 18px) scale(0.96);
    border: 1px solid rgba(249, 195, 210, 0.72);
    border-radius: 18px;
    background: rgba(16, 3, 10, 0.9);
    box-shadow: 0 0 35px rgba(205, 62, 115, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
  }
  .proposal-card.visible {
    transform: translate(-50%, 0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .proposal-card .question {
    margin: 0.35rem 0 0.85rem;
    color: #fff3f6;
    font-size: clamp(1rem, 3vw, 1.35rem);
  }
  .answers {
    display: flex;
    justify-content: center;
    gap: 0.65rem;
  }
  .answer {
    border: 1px solid rgba(249, 195, 210, 0.75);
    border-radius: 999px;
    padding: 0.45rem 0.8rem;
    color: #18040c;
    background: #f9c3d2;
    font: bold 0.78rem Menlo, Consolas, monospace;
    cursor: pointer;
  }
  .answer:hover, .answer:focus-visible {
    background: #fff;
    outline: none;
  }
  .petal {
    position: fixed;
    top: -2rem;
    z-index: 3;
    color: #f39ab2;
    font: bold 1.1rem Georgia, serif;
    pointer-events: none;
    animation: fall 3.8s ease-in forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--drift), 110vh, 0) rotate(420deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<main class="dedication" aria-label="A romantic flower dedication">
  <header>
    <h1>Lilies for you, Sanjida ♡</h1>
  </header>
</main>
<section class="proposal-card" id="proposal-card" aria-live="polite" aria-hidden="true">
  <p class="question">Sanjida, will you keep choosing me?</p>
  <div class="answers">
    <button class="answer" type="button" data-yes="1">YES, obviously</button>
    <button class="answer" type="button" data-yes="2">I am a bitch</button>
  </div>
</section>
<script src="bouquet.js"></script>
</body>
</html>
